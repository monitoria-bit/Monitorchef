<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050f24">
<title>Voto Azul | Biblioteca Professora Socorro Amorim</title>
<link rel="icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{--bg:#050f24;--bg2:#0a2147;--b1:#0877F9;--b2:#2da0ff;--b3:#103C68;--w:#fff;--s:#AFC7E8;--m:#6B8CAE;--ok:#19d27a;--err:#ff5d5d;
--glass:rgba(16,60,104,.38);--line:rgba(120,180,255,.2);--glow:0 0 22px rgba(8,119,249,.45);
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#020816}
body{font-family:Inter,-apple-system,"SF Pro Text",Roboto,sans-serif;color:var(--w);display:flex;justify-content:center;align-items:center;overflow:hidden}
button,input{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(120% 60% at 50% -5%,#0b3a80 0%,transparent 60%),radial-gradient(90% 50% at 100% 100%,#0a2a58 0%,transparent 60%),var(--bg)}
@media(min-width:600px) and (min-height:640px){
 :root{--st:0px;--sb:0px}
 #app{width:410px;height:min(880px,95vh);border-radius:46px;border:1px solid var(--line);box-shadow:0 0 0 8px #07142c,0 0 80px rgba(8,119,249,.35),0 40px 90px rgba(0,0,0,.7)}
 body{background:radial-gradient(circle at 50% 40%,#0a2a5c,#020816 70%)}
}
.scr{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:calc(var(--st) + 16px) 18px calc(var(--sb) + 96px);scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr{z-index:1}.scr.on{display:flex}.scr.fresh>*,.scr.fresh .cl>*{animation:up .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*.07s)}.scr.fresh .cl>*{animation-delay:calc(var(--i,0)*.09s + .2s)}@keyframes up{from{opacity:0;transform:translateY(28px) scale(.95)}}
.scr.nonav{padding-bottom:calc(var(--sb) + 24px)}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border:0;border-radius:16px;font-weight:700;font-size:1rem;cursor:pointer;background:linear-gradient(180deg,#2b95ff,#0765dc);box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;box-shadow:none}
.btn.ghost{background:rgba(8,40,90,.5);border:1px solid var(--line);box-shadow:none;color:var(--s);margin-top:10px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px;min-height:40px}
.top h2{font-size:1.15rem;font-weight:700;flex:1}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);cursor:pointer;flex:none}
.sub{color:var(--s);font-size:.9rem}
/* splash e login */
#splash,#login{align-items:center;text-align:center;padding:calc(var(--st) + 24px) 24px calc(var(--sb) + 24px)}#splash>:first-child,#login>:first-child{margin-top:auto}#splash>:last-child,#login>:last-child{margin-bottom:auto}.scr>*{flex-shrink:0}
.logo{width:min(250px,64%);animation:fl 6s ease-in-out infinite,gl 3s ease-in-out infinite alternate}@keyframes gl{from{filter:drop-shadow(0 0 16px rgba(8,119,249,.5))}to{filter:drop-shadow(0 0 42px rgba(45,160,255,1))}}
@keyframes fl{50%{transform:translateY(-8px)}}
.tag{color:var(--b2);font-size:.95rem;margin:14px 0 26px;line-height:1.4}
.brand{font-size:2.5rem;font-weight:800;letter-spacing:-1px;text-shadow:0 0 24px rgba(45,160,255,.6)}.brand b{color:var(--b2)}
.ov{font-size:.7rem;letter-spacing:.28em;color:var(--s);margin-top:6px}
.bar{width:150px;height:4px;border-radius:4px;background:rgba(255,255,255,.12);margin:34px auto 8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b1),var(--b2));box-shadow:var(--glow);animation:ld 2.1s ease forwards}
@keyframes ld{to{width:100%}}
#login .logo{width:150px}.lc{width:100%;padding:24px 20px;margin-top:18px;text-align:left}
.lc h3{text-align:center;font-size:1.2rem;margin-bottom:6px}.lc p.sub{text-align:center;margin-bottom:18px}
.fld{display:flex;align-items:center;gap:10px;padding:0 14px;height:54px;border-radius:14px;border:1.5px solid var(--b1);background:rgba(2,12,30,.55);box-shadow:var(--glow);margin-bottom:16px}
.fld input{flex:1;background:none;border:0;outline:0;font-size:1rem}
.fld.bad{border-color:var(--err);animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.err{color:var(--err);font-size:.8rem;margin:-8px 0 12px;display:none}
.sec{display:flex;gap:6px;justify-content:center;align-items:center;color:var(--m);font-size:.75rem;margin-top:16px}.sec svg{width:14px;height:14px}
/* home */
.hd{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.hd img{height:36px}.hd span{flex:1;font-size:.72rem;line-height:1.25;color:var(--s)}.hd span b{display:block;color:#fff;font-size:.85rem}
.av{width:38px;height:38px;border-radius:50%;flex:none}
.hello h2{font-size:1.5rem;font-weight:800}.hello p{color:var(--s);margin:2px 0 16px}
.hero{padding:20px;border-color:rgba(45,160,255,.5);box-shadow:var(--glow);background:linear-gradient(135deg,rgba(16,70,140,.7),rgba(8,119,249,.22));position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:190px;height:190px;background:radial-gradient(circle,rgba(45,160,255,.5),transparent 65%)}
.hero>*{position:relative;z-index:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.68rem;font-weight:700;color:#9dffcd;background:rgba(25,210,122,.16);border:1px solid rgba(25,210,122,.4);padding:5px 10px;border-radius:20px}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.hero h1{font-size:1.75rem;line-height:1.1;margin:12px 0 8px;max-width:75%}.hero p{font-size:.88rem;color:var(--s);margin-bottom:16px;max-width:80%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{padding:14px 6px;text-align:center;border-radius:18px}.stat svg{color:var(--b2);margin-bottom:6px}.stat b{display:block;font-size:1.15rem}.stat small{font-size:.68rem;color:var(--s)}
.box{padding:16px;margin-bottom:14px}.box h3{font-size:.98rem;margin-bottom:12px}
.steps{display:flex;justify-content:space-between;position:relative}
.steps:before{content:"";position:absolute;top:16px;left:12%;right:12%;border-top:2px dotted rgba(120,180,255,.3)}
.stp{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.66rem;color:var(--s);position:relative;flex:1}
.stp i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;background:var(--bg);border:2px solid var(--b1);box-shadow:var(--glow)}
.info li{font-size:.82rem;color:var(--s);margin:0 0 6px 18px}
/* candidatos */
.search{display:flex;align-items:center;gap:10px;padding:0 14px;height:46px;border-radius:14px;border:1px solid var(--b1);background:rgba(2,12,30,.5);margin-bottom:12px}
.search input{flex:1;background:none;border:0;outline:0}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;flex:none}
.chip{padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:rgba(8,40,90,.5);color:var(--s);font-size:.82rem;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:linear-gradient(180deg,#2b95ff,#0765dc);color:#fff;border-color:transparent;box-shadow:var(--glow)}
.cl{display:grid;gap:12px}
.cc{display:flex;gap:14px;align-items:center;padding:12px;cursor:pointer;transition:.2s}
.cc:active{transform:scale(.98)}.cc.sel{border-color:var(--b2);box-shadow:var(--glow)}
.ph{width:76px;height:84px;border-radius:16px;flex:none;border:1px solid var(--line)}
.ci{flex:1;min-width:0}.num{display:inline-block;font-size:.68rem;font-weight:800;background:var(--b1);padding:2px 9px;border-radius:8px}
.cn{font-weight:700;font-size:1.02rem;margin:4px 0 1px}.cr{font-size:.7rem;color:var(--s)}.cq{font-size:.72rem;color:var(--m);margin-top:5px;font-style:italic;line-height:1.3}
.rd{width:26px;height:26px;border-radius:50%;border:2px solid var(--m);display:grid;place-items:center;flex:none}
.cc.sel .rd{background:var(--b1);border-color:var(--b2);box-shadow:var(--glow)}.rd svg{width:15px;height:15px;opacity:0}.cc.sel .rd svg{opacity:1}
/* detalhe */
.dh{height:230px;margin:calc(-1*var(--st) - 16px) -18px 0;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#1565c8,#06193a 75%)}
.dh .ph{width:150px;height:170px;border-radius:30px;margin-top:var(--st);box-shadow:var(--glow)}
.dh .ib{position:absolute;top:calc(var(--st) + 14px);left:16px}
.dn{font-size:1.8rem;font-weight:800;margin:12px 0 2px}
.prop{display:flex;gap:10px;align-items:center;margin:0 0 12px;font-size:.92rem}.prop span{width:22px;height:22px;border-radius:50%;background:var(--b1);display:grid;place-items:center;flex:none}.prop svg{width:13px;height:13px;stroke-width:3}
/* confirmar / sucesso */
.cf{padding:24px 16px;text-align:center;margin-bottom:18px}.cf .ph{width:130px;height:140px;border-radius:26px;margin:0 auto 12px;box-shadow:var(--glow)}
.ok{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(8,119,249,.4),transparent 70%);border:3px solid var(--b2);box-shadow:var(--glow);margin:20px auto;animation:pu 2s infinite}
.ok svg{width:68px;height:68px;stroke-width:2.6}@keyframes pu{50%{box-shadow:0 0 50px rgba(45,160,255,.8)}}
.cen{text-align:center}.cen h2{font-size:1.7rem;margin-bottom:8px}.cen em{display:block;color:var(--m);font-size:.82rem;margin-top:22px}
/* resultados */
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;margin-bottom:14px}
.seg button{border:0;padding:10px;border-radius:11px;background:none;color:var(--s);font-weight:600;cursor:pointer}
.seg .on{background:linear-gradient(180deg,#2b95ff,#0765dc);color:#fff}
.sm{display:grid;grid-template-columns:repeat(3,1fr);padding:14px;margin-bottom:14px;text-align:center}.sm small{display:block;color:var(--s);font-size:.7rem}.sm b{font-size:1.4rem}
.rr{margin-bottom:14px}.rr .l{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:6px}.rr .t{height:9px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.rr .t i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--b1),var(--b2));box-shadow:var(--glow);transition:width 1s}
.dn2{width:150px;height:150px;border-radius:50%;margin:6px auto 18px;display:grid;place-items:center;position:relative}
.dn2 div{width:108px;height:108px;border-radius:50%;background:#071a3a;display:grid;place-items:center;text-align:center;line-height:1.1}.dn2 b{font-size:1.7rem}.dn2 small{font-size:.65rem;color:var(--s)}
/* perfil */
.pf{text-align:center;margin-bottom:18px}.pf .av{width:92px;height:92px;border:2px solid var(--b2);box-shadow:var(--glow)}.pf h2{margin:10px 0 2px}
.mi{display:flex;align-items:center;gap:12px;padding:16px;margin-bottom:10px;cursor:pointer}.mi span{flex:1}.mi svg:first-child{color:var(--s)}
/* tab bar */
#tabs{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-around;align-items:flex-end;padding:8px 6px calc(var(--sb) + 8px);background:rgba(5,15,36,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);z-index:20}
#tabs.on{display:flex}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.62rem;font-weight:500;color:var(--m);background:none;border:0;cursor:pointer;padding:4px 0}
.tb.on{color:var(--b2)}.tb.on svg{filter:drop-shadow(0 0 7px rgba(45,160,255,.8))}
.tb.mid i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin-top:-26px;background:radial-gradient(circle at 50% 30%,#2b95ff,#0658c4);border:2px solid #7cc0ff;box-shadow:var(--glow);color:#fff}
.toast{position:absolute;left:50%;bottom:calc(var(--sb) + 100px);transform:translateX(-50%);background:#0a2a58;border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-size:.82rem;z-index:50;opacity:0;pointer-events:none;transition:.3s}.toast.on{opacity:1}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
#app:before,#app:after{content:"";position:absolute;z-index:0;width:330px;height:330px;border-radius:50%;filter:blur(72px);opacity:.55;pointer-events:none;animation:au 13s ease-in-out infinite alternate}
#app:before{background:#0877F9;top:-100px;left:-90px}#app:after{background:#16b8d4;bottom:-110px;right:-100px;opacity:.32;animation-delay:-6s}@keyframes au{to{transform:translate(100px,80px) scale(1.3)}}
.fld input{min-width:0;text-overflow:ellipsis}.fld:focus-within{box-shadow:0 0 0 4px rgba(45,160,255,.25),var(--glow)}
.brand b{background:linear-gradient(90deg,#2da0ff,#d6eeff,#2da0ff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:tx 3s linear infinite}@keyframes tx{to{background-position:-200% 0}}
.btn,.cc,.chip,.mi{position:relative;overflow:hidden}
.btn:not(:disabled):after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:sw 3.2s ease-in-out infinite}@keyframes sw{60%,100%{left:140%}}
.rp{position:absolute;border-radius:50%;background:rgba(140,200,255,.4);transform:scale(0);animation:rp .65s ease-out forwards;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
.hero{animation:hp 3.5s ease-in-out infinite alternate}@keyframes hp{to{box-shadow:0 0 42px rgba(45,160,255,.75)}}.hero:after{animation:bl 4s ease-in-out infinite alternate}@keyframes bl{to{transform:translate(-34px,34px) scale(1.35)}}
.stat svg{animation:bob 3s ease-in-out infinite}.stat:nth-child(2) svg{animation-delay:-1s}.stat:nth-child(3) svg{animation-delay:-2s}@keyframes bob{50%{transform:translateY(-4px) scale(1.12)}}
.stp i{animation:pu2 2.4s ease-in-out infinite}.stp:nth-child(2) i{animation-delay:.3s}.stp:nth-child(3) i{animation-delay:.6s}.stp:nth-child(4) i{animation-delay:.9s}@keyframes pu2{50%{box-shadow:0 0 24px rgba(45,160,255,1);transform:scale(1.1)}}
.pill:before{animation:bk 1.4s infinite}@keyframes bk{50%{opacity:.2}}
.cc .ph{animation:fl2 5s ease-in-out infinite}@keyframes fl2{50%{transform:translateY(-3px)}}.cc:hover{border-color:var(--b2)}
.cc.sel{animation:sp 1.8s ease-in-out infinite}@keyframes sp{50%{box-shadow:0 0 36px rgba(45,160,255,.9)}}
.dh{overflow:hidden}.dh:before{content:"";position:absolute;width:470px;height:470px;border-radius:50%;background:conic-gradient(transparent,rgba(45,160,255,.45),transparent 30%,rgba(45,160,255,.3),transparent 62%);animation:rot 7s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}.dh .ph{position:relative;animation:fl 5s ease-in-out infinite}
.tb.on svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{from{transform:scale(.5) translateY(6px)}}
.tb.mid i{animation:ring 2.2s infinite}@keyframes ring{0%{box-shadow:0 0 0 0 rgba(45,160,255,.7),var(--glow)}100%{box-shadow:0 0 0 20px rgba(45,160,255,0),var(--glow)}}
.rr .t i{animation:gr 1.3s cubic-bezier(.2,.8,.2,1) both}@keyframes gr{from{width:0}}
.dn2{animation:sin 1.2s cubic-bezier(.2,.8,.2,1) both}@keyframes sin{from{transform:rotate(-140deg) scale(.5);opacity:0}}
.ok{animation:pu 2s infinite,bo .9s cubic-bezier(.3,1.5,.5,1) both}@keyframes bo{from{transform:scale(0)}}.ok svg{stroke-dasharray:30;stroke-dashoffset:30;animation:dr .7s .35s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* ===== LIQUID GLASS ===== */
.glass,.ib,.chip,.search{background:linear-gradient(135deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.06) 38%,rgba(255,255,255,.02) 62%,rgba(255,255,255,.14) 100%),rgba(12,52,108,.26);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(22px) saturate(180%) brightness(1.08);-webkit-backdrop-filter:blur(22px) saturate(180%) brightness(1.08);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.1),inset 1px 0 0 rgba(255,255,255,.14),inset -1px 0 0 rgba(255,255,255,.14),0 12px 32px rgba(0,10,40,.42)}
.glass.hero{background:linear-gradient(135deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.05) 42%,rgba(8,119,249,.32) 100%),rgba(16,70,140,.4);border-color:rgba(160,210,255,.5);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(255,255,255,.12),var(--glow),0 14px 36px rgba(0,10,40,.45)}
.chip.on{background:linear-gradient(180deg,rgba(80,170,255,.95),rgba(7,101,220,.9));border-color:rgba(255,255,255,.4);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),var(--glow)}
.cc.sel{border-color:rgba(160,210,255,.8);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),var(--glow)}
.btn:not(.ghost){background:linear-gradient(180deg,rgba(90,175,255,.98),rgba(7,101,220,.92));border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -2px 6px rgba(0,60,160,.35),var(--glow),0 8px 22px rgba(8,119,249,.35)}
.btn.ghost{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04));backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45)}
.fld{background:rgba(2,12,30,.4);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),var(--glow)}
#tabs{left:12px;right:12px;bottom:calc(var(--sb) + 10px);padding:8px 8px 8px;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05) 45%,rgba(255,255,255,.12)),rgba(10,40,90,.34);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(26px) saturate(190%) brightness(1.1);-webkit-backdrop-filter:blur(26px) saturate(190%) brightness(1.1);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(255,255,255,.1),0 14px 34px rgba(0,8,34,.55)}
.toast{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.06)),rgba(10,42,88,.55);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 28px rgba(0,8,34,.5);bottom:calc(var(--sb) + 104px)}
#app:before{opacity:.75}#app:after{opacity:.5}
.ph img{opacity:0;transition:opacity .3s}.ph.has img{opacity:1}.ph.has svg{display:none}
.nm{font-weight:800;font-size:1.05rem;display:grid;place-items:center}
/* --- acréscimos para dados reais --- */
.ph{position:relative;overflow:hidden}
.ph svg{position:absolute;inset:0}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.empty{text-align:center;color:var(--s);padding:30px 10px;font-size:.9rem}
.pill.off{color:#ffd0d0;background:rgba(255,93,93,.14);border-color:rgba(255,93,93,.4)}
.pill.off:before{background:var(--err);box-shadow:0 0 8px var(--err)}
.err{margin:-6px 0 12px}

/* ===== URNA ===== */
.urna{padding:16px;margin-bottom:12px;text-align:center}
.urna .lbl{font-size:.7rem;letter-spacing:.2em;color:var(--s);margin-bottom:10px}
.dg{display:flex;gap:10px;justify-content:center;margin-bottom:12px}
.dg i{width:58px;height:70px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-size:2.2rem;font-weight:800;background:rgba(2,12,30,.55);border:1.5px solid var(--b1);box-shadow:var(--glow)}
.dg i.cur{border-color:var(--b2);animation:sp 1.2s ease-in-out infinite}
.ucand{min-height:116px;display:flex;align-items:center;gap:14px;text-align:left;justify-content:center}
.ucand .ph{width:84px;height:94px;border-radius:16px}
.ucand .cn{font-size:1.15rem;margin:2px 0}
.ucand.empty0{color:var(--m);font-size:.85rem;justify-content:center;text-align:center}
.ucand.wrong{color:var(--err);flex-direction:column;gap:2px;justify-content:center;text-align:center}.ucand.wrong b{font-size:1.2rem}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.kp button{height:54px;border-radius:16px;border:1px solid rgba(255,255,255,.26);font-size:1.5rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05)),rgba(12,52,108,.35);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45);transition:transform .1s}
.kp button:active{transform:scale(.94)}
.kp .z{grid-column:2}
.act{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act button{height:58px;border-radius:16px;border:0;font-weight:800;font-size:1rem;letter-spacing:.04em;color:#fff;cursor:pointer;transition:transform .1s}
.act button:active{transform:scale(.96)}
.act .no{background:linear-gradient(180deg,#ff6b6b,#d62f2f);box-shadow:0 0 18px rgba(255,93,93,.4),inset 0 1.5px 0 rgba(255,255,255,.5)}
.act .yes{background:linear-gradient(180deg,#2ee68c,#0fa85d);box-shadow:0 0 18px rgba(25,210,122,.45),inset 0 1.5px 0 rgba(255,255,255,.5)}
.act .yes:disabled{opacity:.35;box-shadow:none}

/* ===== URNA: tela única, sem rolar ===== */
#vote{overflow:hidden;padding-top:calc(var(--st) + 10px);padding-bottom:calc(var(--sb) + 92px)}
#vote .top{margin-bottom:8px;min-height:36px}#vote .ib{width:36px;height:36px}
#vote .urna{padding:10px 12px;margin-bottom:10px}
#vote .urna .lbl{font-size:.64rem;margin-bottom:8px}
#vote .dg{gap:8px;margin-bottom:8px}
#vote .dg i{width:clamp(44px,13vw,54px);height:clamp(48px,8.5dvh,66px);font-size:clamp(1.6rem,4.2dvh,2.2rem);border-radius:12px}
#vote .ucand{min-height:clamp(74px,12dvh,104px);gap:12px}
#vote .ucand .ph{width:clamp(54px,9dvh,76px);height:clamp(60px,10dvh,84px);border-radius:14px}
#vote .ucand .cn{font-size:clamp(.95rem,2.4dvh,1.1rem)}
#vote .ucand .cr{font-size:.66rem}
#vote .kp{flex:1 1 0;min-height:0;grid-template-rows:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:0}
#vote .kp button{height:100%;min-height:0;font-size:clamp(1.2rem,3.4dvh,1.5rem)}
.kp .no,.kp .yes{border:0;color:#fff;font-size:.82rem!important;font-weight:800;letter-spacing:.03em}
.kp .no{background:linear-gradient(180deg,#ff6b6b,#d62f2f);box-shadow:0 0 16px rgba(255,93,93,.4),inset 0 1.5px 0 rgba(255,255,255,.5)}
.kp .yes{background:linear-gradient(180deg,#2ee68c,#0fa85d);box-shadow:0 0 16px rgba(25,210,122,.45),inset 0 1.5px 0 rgba(255,255,255,.5)}
.kp .yes:disabled{opacity:.35;box-shadow:none}
@media(max-height:640px){#vote .top{display:none}#vote{padding-top:calc(var(--st) + 8px)}}

/* número em destaque (candidatos) */
.bn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;padding:8px 10px;border-radius:16px;background:linear-gradient(180deg,rgba(90,175,255,.98),rgba(7,101,220,.92));border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),var(--glow);flex:none}
.bn small{font-size:.6rem;font-weight:700;letter-spacing:.14em;opacity:.85;line-height:1}
.bn b{font-size:2rem;font-weight:800;line-height:1.05;letter-spacing:.02em}
.bn.big{align-self:center;margin-top:18px;min-width:120px;padding:12px 22px;border-radius:22px}.bn.big small{font-size:.7rem}.bn.big b{font-size:3.4rem}

/* ===== ELEITO MONITOR-CHEFE (dourado) ===== */
#champ{background:radial-gradient(110% 50% at 50% 0%,rgba(255,196,0,.42),transparent 62%),radial-gradient(90% 45% at 50% 100%,rgba(255,140,0,.22),transparent 60%),#130d02;align-items:center;text-align:center;padding-bottom:calc(var(--sb) + 24px)}
.crown{width:64px;height:64px;color:#ffd23f;stroke-width:1.6;fill:rgba(255,210,63,.25);filter:drop-shadow(0 0 14px rgba(255,200,40,.9));animation:fl 3s ease-in-out infinite}
.gh{margin-top:8px}.gl{font-size:2.6rem;font-weight:800;letter-spacing:.06em;line-height:1;background:linear-gradient(90deg,#ffb800,#fff3b0,#ffd23f,#fff3b0,#ffb800);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:tx 3s linear infinite;filter:drop-shadow(0 0 14px rgba(255,190,0,.55))}
.gt2{font-size:1.25rem;font-weight:800;letter-spacing:.28em;color:#ffd23f;margin-top:6px;text-shadow:0 0 16px rgba(255,200,40,.7)}
.gs{color:#f3dfa0;font-size:.85rem;margin:10px 8px 0;line-height:1.4}
.gwrap{position:relative;width:190px;height:210px;margin:22px auto 4px;display:grid;place-items:center}
.rays{position:absolute;width:420px;height:420px;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(255,210,63,.4),transparent 14%,rgba(255,210,63,.28),transparent 32%,rgba(255,210,63,.4),transparent 48%,rgba(255,210,63,.28),transparent 66%,rgba(255,210,63,.4),transparent 82%);animation:rot 9s linear infinite;-webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%)}
.gwrap .ph{position:relative;width:168px;height:188px;border-radius:34px;border:3px solid #ffd23f;box-shadow:0 0 0 5px rgba(255,210,63,.25),0 0 46px rgba(255,190,0,.85);animation:fl 5s ease-in-out infinite}
.gnum{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#ffe27a,#ffb800);color:#2a1a00;font-weight:800;padding:5px 16px;border-radius:14px;font-size:.95rem;box-shadow:0 0 18px rgba(255,190,0,.7)}
.gname{font-size:1.75rem;font-weight:800;margin-top:20px;line-height:1.15;color:#fff;text-shadow:0 0 20px rgba(255,200,40,.5)}
.gvotes{margin:12px auto 0;padding:10px 26px;border-radius:20px;background:linear-gradient(180deg,rgba(255,226,122,.95),rgba(255,184,0,.95));color:#2a1a00;display:inline-flex;align-items:baseline;gap:10px;box-shadow:0 0 30px rgba(255,190,0,.6),inset 0 1.5px 0 rgba(255,255,255,.7)}
.gvotes b{font-size:2.8rem;line-height:1;font-weight:800}.gvotes span{font-weight:700;font-size:.95rem}
#champ .glass{background:linear-gradient(135deg,rgba(255,226,122,.2),rgba(255,255,255,.04)),rgba(60,40,0,.35);border-color:rgba(255,210,63,.4);box-shadow:inset 0 1.5px 0 rgba(255,240,180,.45),0 12px 32px rgba(0,0,0,.4)}
#champ .box{width:100%;text-align:left}
#champ .rr .t i{background:linear-gradient(90deg,#ffb800,#ffe27a);box-shadow:0 0 12px rgba(255,190,0,.6)}
.gtie{display:flex;gap:16px;justify-content:center;margin-top:20px}.gtie>div{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:42%}.gtie .ph{width:110px;height:122px;border-radius:22px;border:2px solid #ffd23f;box-shadow:0 0 26px rgba(255,190,0,.6)}.gtie b{font-size:.95rem}.gtie small{color:#f3dfa0}
.gbtn{background:linear-gradient(180deg,#ffe27a,#ffb800)!important;color:#2a1a00!important;border:1px solid rgba(255,255,255,.5)!important;box-shadow:0 0 22px rgba(255,190,0,.55),inset 0 1.5px 0 rgba(255,255,255,.7)!important}
#champ .gbtn.ghost{background:rgba(255,210,63,.1)!important;color:#ffd23f!important;border:1px solid rgba(255,210,63,.45)!important;box-shadow:none!important;margin-top:16px}
#champ .gbtn.ghost:after{display:none}
.gbtn .crown{width:22px;height:22px;animation:none;fill:none;filter:none;color:#2a1a00}

.pill.wait{color:#ffe9a8;background:rgba(255,196,0,.14);border-color:rgba(255,196,0,.45)}
.pill.wait:before{background:#ffc400;box-shadow:0 0 8px #ffc400}
</style>

<body>
<div id="app">
 <canvas id="fx"></canvas>
 <section class="scr on nonav" id="splash"><img class="logo" src="logo.webp" alt="Biblioteca Professora Socorro Amorim"><p class="tag">Conhecimento transforma.<br>Sua voz também.</p><div class="brand">VOTO <b>AZUL</b></div><div class="ov">ELEIÇÃO MONITOR-CHEFE</div><div class="bar"><i></i></div><small class="sub">Carregando...</small></section>

 <section class="scr nonav" id="login"><img class="logo" src="logo.webp" alt=""><div class="brand" style="font-size:2rem;margin-top:8px">VOTO <b>AZUL</b></div><div class="ov">ELEIÇÃO MONITOR-CHEFE</div>
  <div class="glass lc"><h3>Acesse sua conta</h3><p class="sub">Digite o código de acesso que você recebeu.</p>
   <div class="fld" id="fld"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="code" placeholder="Código de acesso" autocomplete="off" inputmode="numeric" maxlength="30"></div>
   <div class="err" id="err">Digite seu código para entrar.</div>
   <button class="btn" id="go">Entrar</button>
   <div class="sec"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.2 7.8 8 9 4.8-1.2 8-4.5 8-9V6z"/></svg>Seus dados estão protegidos e o voto é secreto.</div></div>
 </section>

 <section class="scr" id="home"></section>
 <section class="scr" id="cands"></section>
 <section class="scr nonav" id="detail"></section>
 <section class="scr" id="vote"></section>
 <section class="scr nonav" id="confirm"></section>
 <section class="scr nonav" id="done"></section>
 <section class="scr" id="results"></section>
 <section class="scr nonav" id="champ"></section>
 <section class="scr" id="profile"></section>

 <nav id="tabs"></nav><div class="toast" id="toast"></div>
</div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,collection,doc,getDoc,onSnapshot,query,orderBy,writeBatch,runTransaction,increment,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// ====== CHAVE DO FIREBASE DESTA PÁGINA (página dos eleitores) ======
// Console do Firebase > Configurações do projeto > Seus aplicativos > Web > firebaseConfig
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDKZzipPHbi5EaSLT-5Red-xtdaEWokegI",
  authDomain: "biblioteca-f186d.firebaseapp.com",
  projectId: "biblioteca-f186d",
  storageBucket: "biblioteca-f186d.firebasestorage.app",
  messagingSenderId: "800513581384",
  appId: "1:800513581384:web:431ab71ba6826de552137d",
  measurementId: "G-8TQLCBWK7H"
};
const configured=!String(firebaseConfig.apiKey).startsWith('COLE');
const db=getFirestore(initializeApp(firebaseConfig));
// ===================================================================

const P={home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14.4c2.2.6 3.5 2.6 3.5 5.6"/>',shield:'<path d="M12 3 4 6v6c0 4.5 3.2 7.8 8 9 4.8-1.2 8-4.5 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',chart:'<path d="M5 20V10M12 20V4M19 20v-7"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',back:'<path d="m15 18-6-6 6-6"/>',chev:'<path d="m9 18 6-6-6-6"/>',check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.01"/>',out:'<path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5M16 8l4 4-4 4M20 12H9"/>',lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const GR=[['#1f6fd1','#0a2f66'],['#2aa3e8','#0b3a70'],['#4a7be8','#112a66'],['#1bb5c9','#0a3558']];
const LOGO='logo.webp';

let C=[];                      // candidatos (vêm do Firestore em tempo real)
const st={dig:'',sel:null,code:null,name:'',voted:false,status:'carregando',ready:false,filter:'',q:'',cur:'splash',prev:'home',det:null};

const num=c=>'Nº '+String(c.numero||0).padStart(2,'0');
const votos=c=>c.votos||0;
const total=()=>C.reduce((a,c)=>a+votos(c),0);
const aberta=()=>st.status==='aberta',enc=()=>st.status==='encerrada',naoIni=()=>st.status==='aguardando';
const stTxt=()=>aberta()?'ELEIÇÃO EM ANDAMENTO':enc()?'ELEIÇÃO ENCERRADA':naoIni()?'ELEIÇÃO NÃO INICIADA':'CARREGANDO...';
const stCls=()=>aberta()?'':enc()?'off':'wait';

// foto real do candidato (URL do imgbb); se falhar, mostra a silhueta
const photo=c=>{const g=GR[(c.numero||0)%GR.length];
 return `<div class="ph" style="background:linear-gradient(160deg,${g[0]},${g[1]})"><svg viewBox="0 0 80 90" width="100%" height="100%"><circle cx="40" cy="34" r="16" fill="rgba(255,255,255,.88)"/><path d="M8 90c2-24 16-34 32-34s30 10 32 34z" fill="rgba(255,255,255,.88)"/></svg>${c.foto?`<img src="${esc(c.foto)}" alt="${esc(c.nome)}" referrerpolicy="no-referrer" loading="lazy" onload="this.parentNode.classList.add('has')" onerror="this.remove()">`:''}</div>`};
const first=()=>(st.name||'').trim().split(/\s+/)[0]||'eleitor';
const ini=()=>`<div class="av nm" style="background:linear-gradient(135deg,#0877F9,#2da0ff)">${esc(first()[0]||'?').toUpperCase()}</div>`;

const CROWN='<svg class="i crown" viewBox="0 0 24 24"><path d="M3 19h18M4 17 3 7l5 4 4-6 4 6 5-4-1 10z"/></svg>';
const TABS=[['home','Início','home'],['cands','Candidatos','users'],['vote','Votar','shield'],['results','Resultados','chart'],['profile','Perfil','user']];
function show(id){
 document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
 const el=$(id);el.classList.add('on');el.scrollTop=0;[...el.children].forEach((c,i)=>{c.style.setProperty('--i',i);if(c.classList.contains('cl'))[...c.children].forEach((d,j)=>d.style.setProperty('--i',j))});el.classList.add('fresh');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('fresh'),2000);if(id==='done')setTimeout(burst,350);
 const t=TABS.find(x=>x[0]===id);
 $('tabs').classList.toggle('on',!!t);
 $('tabs').innerHTML=TABS.map(([k,l,i])=>`<button class="tb ${k==='vote'?'mid':''} ${k===id?'on':''}" onclick="go('${k}')">${k==='vote'?`<i>${ic(i)}</i>`:ic(i)}<span>${l}</span></button>`).join('');
 st.cur=id;
}
function go(id){
 if(id==='vote'||id==='confirm'){
  if(enc()){toast('A votação está encerrada');id='champ'}
  else if(!aberta()){toast('A votação ainda não começou');id='home'}
  else if(st.voted)id='done';
  else if(id==='confirm'&&!C.find(c=>c.id===st.sel))id='vote';
 }
 if(id==='champ'&&!enc()){toast(aberta()?'A votação ainda está em andamento':'A eleição ainda não começou');id='home'}if(id!=='champ')st._cb=0;if(id==='vote'){st.dig='';st.sel=null}if(R[id])R[id]();show(id);if(id==='results')cnt('.dn2 b,.sm div:first-child b')}
const back=()=>go(st.prev||'home');

const R={
home(){const n=C.length;
 const act=enc()?'Ver o eleito':naoIni()?'Aguardando o início':st.voted?`Ver meu voto`:'Participar da votação';
 $('home').innerHTML=`<div class="hd"><img src="${LOGO}" alt=""><span><b>BIBLIOTECA</b>Professora Socorro Amorim</span><div class="ib" style="position:relative">${ic('bell')}</div>${ini()}</div>
<div class="hello"><h2>Olá, ${esc(first())}!</h2><p>Sua participação faz toda a diferença!</p></div>
<div class="glass hero"><span class="pill ${stCls()}">${stTxt()}</span><h1>Sua voz escolhe o futuro.</h1><p>Participe da eleição do próximo Monitor-Chefe da nossa biblioteca.</p><button class="btn" onclick="${enc()?`go('champ')`:naoIni()?`toast('A eleição ainda não começou')`:st.voted?`go('done')`:`go('vote')`}">${act} ${ic('arrow')}</button></div>
<div class="stats"><div class="glass stat">${ic('users')}<b>${n}</b><small>Candidatos</small></div><div class="glass stat">${ic('shield')}<b>1</b><small>Voto por aluno</small></div><div class="glass stat">${ic('chart')}<b>${total()}</b><small>Votos até agora</small></div></div>
<div class="glass box"><h3>Etapas da votação</h3><div class="steps">${['Login','Escolha','Confirme','Voto registrado'].map((s,i)=>`<div class="stp"><i>${i+1}</i>${s}</div>`).join('')}</div></div>
<div class="glass box"><h3 style="display:flex;gap:8px;align-items:center">${ic('info')} Informações importantes</h3><ul class="info"><li>Cada aluno pode votar apenas 1 vez.</li><li>O voto é secreto e seguro.</li><li>Em caso de dúvidas, procure a equipe da biblioteca.</li></ul></div>`},

cands(){
 if(!$('cands').dataset.r){$('cands').dataset.r=1;$('cands').innerHTML=`<div class="top"><h2>Candidatos</h2></div><div class="search">${ic('search')}<input id="q" placeholder="Buscar candidato..." oninput="st.q=this.value.toLowerCase();R.cands()"></div><div class="chips" id="chips"></div><div class="cl" id="cl"></div>`}
 if(st.filter&&!C.find(c=>c.id===st.filter))st.filter='';
 $('chips').innerHTML=[['Todos',''],...C.map(c=>[num(c),c.id])].map(([t,id])=>`<button class="chip ${st.filter===id?'on':''}" onclick="st.filter='${id}';R.cands()">${t}</button>`).join('');
 const l=C.filter(c=>(!st.filter||c.id===st.filter)&&c.nome.toLowerCase().includes(st.q));
 $('cl').innerHTML=!st.ready?'<p class="empty">Carregando candidatos...</p>':l.map(c=>`<div class="glass cc" onclick="detail('${c.id}')">${photo(c)}<div class="ci"><div class="cn">${esc(c.nome)}</div><div class="cr">Candidato(a) a Monitor-Chefe</div></div><div class="bn"><small>Nº</small><b>${String(c.numero||0).padStart(2,'0')}</b></div></div>`).join('')||`<p class="empty">${C.length?'Nenhum candidato encontrado.':'Nenhum candidato cadastrado ainda.'}</p>`},

vote(){
 $('vote').innerHTML=`<div class="top"><div class="ib" onclick="go('home')">${ic('back')}</div><h2>Votação</h2></div>
 <div class="glass urna"><div class="lbl">DIGITE O NÚMERO DO CANDIDATO</div><div class="dg"><i id="d0"></i><i id="d1"></i></div><div class="ucand" id="uc"></div></div>
 <div class="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="kp('${n}')">${n}</button>`).join('')}<button class="no" onclick="kc()">CANCELAR</button><button onclick="kp('0')">0</button><button class="yes" id="kv" onclick="kv()" disabled>VOTAR</button></div>`;
 urnaUpd()},

confirm(){const c=C.find(x=>x.id===st.sel);if(!c)return go('vote');
 $('confirm').innerHTML=`<div class="top"><div class="ib" onclick="go('vote')">${ic('back')}</div><h2>Confirme seu voto</h2></div><div class="glass cf">${photo(c)}<span class="num">${num(c)}</span><div class="cn" style="font-size:1.4rem">${esc(c.nome)}</div><div class="cr">Candidato(a) a Monitor-Chefe</div></div>
 <h3 style="text-align:center;font-size:1.1rem">Tem certeza de que deseja enviar seu voto?</h3><p class="sub" style="text-align:center;margin:8px 0 22px;font-size:.82rem">Após a confirmação, não será possível alterar sua escolha.</p>
 <button class="btn" id="cv" onclick="send()">Confirmar voto</button><button class="btn ghost" onclick="go('vote')">Voltar</button>`},

done(){$('done').innerHTML=`<div class="cen" style="margin:auto 0"><div class="ok">${ic('check')}</div><h2>Voto registrado<br>com sucesso!</h2><p class="sub">Obrigado por participar da escolha do próximo Monitor-Chefe.</p><div class="glass box" style="margin:22px 0 18px;text-align:left"><b style="color:var(--ok)">Voto confirmado</b><p class="sub" style="font-size:.82rem;margin-top:4px">Seu voto foi registrado de forma segura e anônima.</p></div><button class="btn ghost" style="margin:0" onclick="go('home')">Voltar para o início</button><em>“Grandes mudanças começam com pequenas atitudes.”<br>Biblioteca Professora Socorro Amorim</em></div>`},

results(){
 const tot=total();let acc=0;const cols=['#2da0ff','#0877F9','#1a56a8','#5f86b8','#16b8d4','#7aa7d9'];
 const grad=tot?C.map((c,i)=>{const s=acc;acc+=votos(c)/tot*100;return`${cols[i%cols.length]} ${s}% ${acc}%`}).join(','):'#17386b 0% 100%';
 $('results').innerHTML=`<div class="top"><div class="ib" onclick="go('home')">${ic('back')}</div><h2>Resultados</h2></div>
 <div class="glass sm"><div><small>Total de votos</small><b>${tot}</b></div><div><small>Candidatos</small><b>${C.length}</b></div><div><small>Status</small><b style="font-size:1rem;line-height:2">${aberta()?'Em andamento':enc()?'Encerrada':naoIni()?'Não iniciada':'...'}</b></div></div>
 <div class="glass box"><h3>Distribuição dos votos</h3><div class="dn2" style="background:conic-gradient(${grad})"><div><span><b>${tot}</b><br><small>votos</small></span></div></div>
 ${C.map(c=>{const p=tot?Math.round(votos(c)/tot*100):0;return`<div class="rr"><div class="l"><span>${esc(c.nome)}</span><b>${p}% <small style="color:var(--s)">(${votos(c)})</small></b></div><div class="t"><i style="width:${p}%"></i></div></div>`}).join('')||'<p class="empty">Nenhum candidato cadastrado ainda.</p>'}
 ${!enc()?'':`<button class="btn gbtn" style="margin-bottom:12px" onclick="go('champ')">${CROWN} Ver o eleito</button>`}
 <p class="sub" style="text-align:center;font-size:.7rem">Atualizado em tempo real.</p></div>`},

champ(){
 const tot=total(),max=C.reduce((m,c)=>Math.max(m,votos(c)),0),top=C.filter(c=>max>0&&votos(c)===max);
 const rank=[...C].sort((a,b)=>votos(b)-votos(a)||(a.numero||0)-(b.numero||0));
 const lista=`<div class="glass box" style="margin-top:18px"><h3>Resultado final</h3>${rank.map((c,i)=>{const p=tot?Math.round(votos(c)/tot*100):0;const w=top.some(t=>t.id===c.id);return`<div class="rr"><div class="l"><span>${i+1}º · ${esc(c.nome)} <small style="color:var(--s)">(${num(c)})</small></span><b>${votos(c)} <small style="color:var(--s)">${p}%</small></b></div><div class="t gt"><i style="width:${p}%"></i></div></div>`}).join('')}<p class="sub" style="text-align:center;font-size:.72rem;margin-top:6px">Total de votos: ${tot}</p></div>`;
 const fim=`<button class="btn ghost gbtn" onclick="go('home')">Voltar para o início</button>`;
 let corpo;
 if(!st.ready)corpo='<p class="empty">Carregando...</p>';
 else if(!tot||!top.length)corpo=`<div class="gh">${CROWN}<div class="gl">ELEIÇÃO ENCERRADA</div></div><p class="empty">Nenhum voto foi registrado.</p>`;
 else if(top.length>1)corpo=`<div class="gh">${CROWN}<div class="gl">EMPATE</div><div class="gs">${top.length} candidatos com ${max} voto${max===1?'':'s'} cada</div></div><div class="gtie">${top.map(c=>`<div>${photo(c)}<b>${esc(c.nome)}</b><small>${num(c)}</small></div>`).join('')}</div>${lista}`;
 else{const c=top[0],p=Math.round(max/tot*100);
  corpo=`<div class="gh">${CROWN}<div class="gl">ELEITO</div><div class="gt2">MONITOR-CHEFE</div></div>
  <div class="gwrap"><div class="rays"></div>${photo(c)}<span class="gnum">${num(c)}</span></div>
  <div class="gname">${esc(c.nome)}</div>
  <div class="gvotes"><b>${max}</b><span>voto${max===1?'':'s'} · ${p}%</span></div>
  <div class="gs">Parabéns! Escolhido(a) pelos alunos da Biblioteca Professora Socorro Amorim.</div>${lista}`}
 $('champ').innerHTML=corpo+fim;
 if(st.ready&&top.length===1&&!st._cb){st._cb=1;setTimeout(()=>burst(1),400);setTimeout(()=>burst(1),1300);setTimeout(()=>burst(1),2400)}},

profile(){$('profile').innerHTML=`<div class="top"><h2>Perfil</h2></div><div class="pf"><div class="av" style="margin:auto;background:linear-gradient(135deg,#0877F9,#2da0ff);display:grid;place-items:center"><svg class="i" viewBox="0 0 24 24" style="width:44px;height:44px">${P.user}</svg></div><h2>${esc(st.name||'Eleitor')}</h2><p class="sub">Código: ${esc(st.code||'')}</p></div>
 <div class="glass box" style="display:flex;gap:12px;align-items:center"><span style="color:${st.voted?'var(--ok)':'var(--s)'}">${ic(st.voted?'check':'info')}</span><div><small class="sub">Participação na eleição</small><br><b>${st.voted?'Voto registrado':'Voto pendente'}</b></div></div>
 ${[['info','Informações da conta',`${st.name||'Eleitor'} · código ${st.code||''}`],['shield','Privacidade e segurança','Guardamos só que seu código já votou, não em quem.'],['help','Ajuda e suporte','Procure a equipe da biblioteca.']].map(([i,t,m])=>`<div class="glass mi" onclick="toast('${m.replace(/'/g,'’')}')">${ic(i)}<span>${t}</span>${ic('chev')}</div>`).join('')}
 <button class="btn ghost" style="color:var(--err);border-color:rgba(255,93,93,.4);margin-top:14px" onclick="logout()">${ic('out')} Sair da conta</button>`}};

function renderDetail(c){
 $('detail').innerHTML=`<div class="dh"><div class="ib" onclick="go('cands')">${ic('back')}</div>${photo(c)}</div><div class="bn big"><small>NÚMERO</small><b>${String(c.numero||0).padStart(2,'0')}</b></div><div class="dn" style="text-align:center">${esc(c.nome)}</div><div class="sub" style="text-align:center">Candidato(a) a Monitor-Chefe</div>`}
function detail(id){const c=C.find(x=>x.id===id);if(!c)return;st.det=id;st.prev='cands';renderDetail(c);show('detail')}


// ===== urna: digitar 2 dígitos =====
const achaN=d=>C.find(c=>String(c.numero||0).padStart(2,'0')===d);
let ac=null;
function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function urnaUpd(){
 if(st.cur!=='vote'&&!$('d0'))return;
 const d=st.dig||'';
 [0,1].forEach(i=>{const e=$('d'+i);if(!e)return;e.textContent=d[i]||'';e.classList.toggle('cur',d.length===i)});
 const uc=$('uc');if(!uc)return;
 const c=d.length===2?achaN(d):null;st.sel=c?c.id:null;
 if(!st.ready){uc.className='ucand empty0';uc.textContent='Carregando candidatos...'}
 else if(d.length<2){uc.className='ucand empty0';uc.textContent=d.length?'Digite o próximo dígito':'Aguardando o número...'}
 else if(c){uc.className='ucand';uc.innerHTML=`${photo(c)}<div><span class="num">${num(c)}</span><div class="cn">${esc(c.nome)}</div><div class="cr">Candidato(a) a Monitor-Chefe</div></div>`}
 else{uc.className='ucand wrong';uc.innerHTML='<b>NÚMERO ERRADO</b><span class="cr">Aperte CANCELAR e digite outro.</span>'}
 const v=$('kv');if(v)v.disabled=!c;
}
function kp(n){if(!aberta())return toast(enc()?'A votação está encerrada':'A votação ainda não começou');if((st.dig||'').length>=2)return;st.dig=(st.dig||'')+n;beep(660,.06);urnaUpd()}
function kc(){st.dig='';st.sel=null;beep(300,.09);urnaUpd()}
function kv(){const c=C.find(x=>x.id===st.sel);if(!c)return;beep(880,.25);go('confirm')}

let sending=false;
async function send(){
 if(sending)return;
 const b=$('cv');const c=C.find(x=>x.id===st.sel);if(!c||!st.code)return;
 if(st.voted){toast('Você já votou');return go('done')}
 sending=true;b.disabled=true;b.textContent='Registrando...';
 try{
  // transação: confere NO BANCO se o código ainda não votou e se a votação está aberta;
  // só então grava "votou" e soma 1 voto, tudo junto (ou nada)
  await runTransaction(db,async tx=>{
   const er=doc(db,'eleitores',st.code),es=await tx.get(er);
   if(!es.exists())throw Object.assign(new Error('sem-eleitor'),{sem:1});
   if(es.data().votou)throw Object.assign(new Error('ja-votou'),{ja:1});
   const cf=await tx.get(doc(db,'config','eleicao'));
   const stt=cf.exists()&&cf.data().status?cf.data().status:'aguardando';
   if(stt==='encerrada')throw Object.assign(new Error('encerrada'),{enc:1});
   if(stt!=='aberta')throw Object.assign(new Error('nao-iniciada'),{nini:1});
   const cs=await tx.get(doc(db,'candidatos',c.id));
   if(!cs.exists())throw Object.assign(new Error('sem-candidato'),{semc:1});
   tx.update(er,{votou:true,votouEm:serverTimestamp()});
   tx.update(cs.ref,{votos:increment(1)});
  });
  sending=false;st.voted=true;R.done();show('done');
 }catch(e){
  console.error(e);sending=false;
  if(e.enc){st.status='encerrada';toast('A votação está encerrada');return go('champ')}
  if(e.nini){st.status='aguardando';toast('A votação ainda não começou');return go('home')}
  if(e.semc){toast('Esse candidato foi removido. Escolha outro.');return go('vote')}
  try{const s=await getDoc(doc(db,'eleitores',st.code));if(s.exists()&&s.data().votou){st.voted=true;toast('Este código já votou');return go('done')}}catch(_){}
  toast(aberta()?'Não foi possível registrar. Tente de novo.':enc()?'A votação está encerrada':'A votação ainda não começou');
  b.disabled=false;b.textContent='Confirmar voto';
 }
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function logout(){if(unV){unV();unV=null}$('code').value='';st.voted=false;st.sel=null;st.code=null;st.name='';try{localStorage.removeItem('votoazul_code')}catch(e){}show('login')}

function fail(msg){const e=$('err');e.textContent=msg;e.style.display='block';$('fld').classList.remove('bad');void $('fld').offsetWidth;$('fld').classList.add('bad')}
async function login(){
 const v=$('code').value.trim().toUpperCase().replace(/\s+/g,'');$('fld').classList.remove('bad');
 if(!v)return fail('Digite seu código para entrar.');
 if(!/^[A-Z0-9_-]{3,30}$/.test(v))return fail('Use só letras, números, - ou _ (mínimo 3 caracteres).');
 if(!configured)return fail('Firebase não configurado. Cole a chave do Firebase no começo do script desta página.');
 $('err').style.display='none';const b=$('go');b.textContent='Entrando...';b.disabled=true;
 try{
  const s=await getDoc(doc(db,'eleitores',v));
  if(!s.exists()){b.textContent='Entrar';b.disabled=false;return fail('Código não encontrado. Confira com a equipe da biblioteca.')}
  st.name=s.data().nome||'';st.voted=!!s.data().votou;entrou(v);go(enc()?'champ':'home');
 }catch(e){console.error(e);const c=e.code||'';fail(c==='permission-denied'?'O banco ainda não liberou o acesso: publique o firestore.rules no Firebase.':c==='unavailable'||c==='failed-precondition'?'Sem conexão com o banco. Verifique a internet e tente de novo.':'Erro ao conectar: '+(c||e.message))}
 b.textContent='Entrar';b.disabled=false;
}
$('go').onclick=login;$('code').onkeydown=e=>{if(e.key==='Enter')login()};

// acompanha o próprio eleitor em tempo real (nome, se já votou, e se o admin zerou a votação)
let unV=null;
function entrou(code){
 st.code=code;try{localStorage.setItem('votoazul_code',code)}catch(e){}
 if(unV)unV();
 unV=onSnapshot(doc(db,'eleitores',code),s=>{
  if(!s.exists()){toast('Este código foi removido');return logout()}
  const d=s.data(),was=st.voted;st.name=d.nome||st.name;st.voted=!!d.votou;
  if(was&&!st.voted){st.sel=null;toast('A votação foi reiniciada');if(st.cur==='done')return go('home')}
  if(was!==st.voted||st.cur==='home'||st.cur==='profile')refresh();
 },e=>console.error(e));
}

// tempo real: candidatos e status da eleição
function refresh(){
 const id=st.cur;
 if(id==='champ'){if(!enc())return go('home');return R.champ()}
 if(id==='detail'){const c=C.find(x=>x.id===st.det);return c?renderDetail(c):go('cands')}
 if(id==='confirm'&&!C.find(x=>x.id===st.sel))return go('vote');
 if(['home','cands','vote','results','profile'].includes(id)&&R[id]){if(id==='vote'){if(st.voted||!aberta())return go('vote');return urnaUpd()}R[id]()}
}
function listen(){
 onSnapshot(query(collection(db,'candidatos'),orderBy('numero')),snap=>{
  C=snap.docs.map(d=>({id:d.id,...d.data()}));st.ready=true;
  if(st.sel&&!C.find(c=>c.id===st.sel))st.sel=null;refresh();
 },e=>{console.error(e);st.ready=true;toast('Erro ao carregar candidatos')});
 onSnapshot(doc(db,'config','eleicao'),s=>{const was=st.status;st.status=s.exists()&&s.data().status?s.data().status:'aguardando';
  if(st.code&&was!==st.status){
   if(enc()&&!['splash','login','champ'].includes(st.cur)){toast('A votação foi encerrada!');return go('champ')}
   if(naoIni()&&['vote','confirm'].includes(st.cur)){toast('A votação ainda não começou');return go('home')}
  }
  refresh()},e=>console.error(e));
}

// partículas e confete (igual ao protótipo)
const cv=$('fx'),cx=cv.getContext('2d');let W=0,H=0,cf=[];const D=Math.min(devicePixelRatio||1,2),ps=[];
function rs(){const r=$('app').getBoundingClientRect();W=r.width;H=r.height;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0)}rs();addEventListener('resize',rs);
for(let i=0;i<40;i++)ps.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.5,v:Math.random()*.4+.12,p:Math.random()*6.3});
function burst(g){const pal=g?['#ffd23f','#ffb800','#fff3b0','#ffffff','#ffcf33']:['#2da0ff','#fff','#0877F9','#9dffcd','#bfe3ff'];for(let i=0;i<110;i++){const a=Math.random()*6.3,s=Math.random()*9+3;cf.push({x:W/2,y:H*.3,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:Math.random()*4+3,c:pal[i%5],a:1,t:Math.random()*6})}}
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)(function f(){cx.clearRect(0,0,W,H);cx.shadowColor='#2da0ff';cx.shadowBlur=8;cx.fillStyle='#8fd0ff';
ps.forEach(p=>{p.y-=p.v;p.p+=.035;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}cx.globalAlpha=.3+.35*Math.sin(p.p);cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.3);cx.fill()});cx.shadowBlur=0;
cf=cf.filter(c=>c.a>.03);cf.forEach(c=>{c.x+=c.vx;c.y+=c.vy;c.vy+=.28;c.vx*=.985;c.a-=.012;c.t+=.2;cx.globalAlpha=c.a;cx.fillStyle=c.c;cx.save();cx.translate(c.x,c.y);cx.rotate(c.t);cx.fillRect(-c.r,-c.r/2,c.r*2,c.r);cx.restore()});requestAnimationFrame(f)})();
function cnt(sel){document.querySelectorAll(sel).forEach(e=>{const n=+e.textContent;if(!n)return;const t0=performance.now();(function s(t){const k=Math.min((t-t0)/1100,1);e.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(s)})(t0)})}
document.addEventListener('pointerdown',e=>{const t=e.target.closest('.btn,.cc,.chip,.mi');if(!t||t.disabled)return;const r=t.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,d=document.createElement('span');d.className='rp';d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;t.appendChild(d);setTimeout(()=>d.remove(),700)});

// funções usadas pelos onclick do HTML
Object.assign(window,{go,R,burst,st,detail,send,toast,logout,back,kp,kc,kv});

// início: splash -> (login automático se o código foi salvo) -> home
show('splash');
if(configured)listen();
setTimeout(async()=>{
 let saved=null;try{saved=localStorage.getItem('votoazul_code')}catch(e){}
 if(saved&&configured){
  try{const s=await getDoc(doc(db,'eleitores',saved));if(s.exists()){st.name=s.data().nome||'';st.voted=!!s.data().votou;entrou(saved);return go(enc()?'champ':'home')}}catch(e){console.error(e)}
 }
 show('login');
},2300);
</script>
</body>
</html>
